services:
  # ----------------------------------------------------
  # 1. Backend Web Service (Node.js + Express + Socket.IO + Mongoose)
  # ----------------------------------------------------
  - type: web
    name: floodguard-ai-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"

  # ----------------------------------------------------
  # 2. Frontend Static Site (React 18 + Vite + Tailwind + Leaflet)
  # ----------------------------------------------------
  - type: static
    name: floodguard-ai-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: floodguard-ai-backend
          property: host
